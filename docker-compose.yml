version: '3.4'

services:
  nexpos-service:
    build:
      context: .
      dockerfile: .docker/Dockerfile.dev
    restart: always
    environment:
      ENV: develop
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
    ports:
      - $HTTP_PORT:$HTTP_PORT
    volumes:
      - .:/go/src/
    depends_on:
      - postgres
    networks:
      - nexpos-service
    extra_hosts:
      - 'host.docker.internal:172.17.0.1'

  postgres:
    image: postgres:15
    restart: always
    tty: true
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - $POSTGRES_PORT:5432
    networks:
      - nexpos-service
    extra_hosts:
      - 'host.docker.internal:172.17.0.1'

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--save", "60", "1", "--loglevel", "warning" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexpos-service
    extra_hosts:
      - 'host.docker.internal:172.17.0.1'

volumes:
  data:
    driver: local
  redis-data:
    driver: local

networks:
  nexpos-service:
    driver: bridge
